# Release on tag push: tests -> build -> TestPyPI -> PyPI
#
#   ./release.sh    (checks, then creates and pushes the tag v<pyproject version>)
#
# No tokens: PyPI/TestPyPI "Trusted Publishing" (OIDC). One time setup in both sites:
#   Project > Publishing > Add GitHub publisher
#     owner: CarlosRCDev, repository: alchemy-api, workflow: publish.yml,
#     environment: testpypi (TestPyPI) / pypi (PyPI)
# Optional: GitHub > Settings > Environments > pypi > "Required reviewers" to approve
# each PyPI release by hand after checking it in TestPyPI.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Same databases as compose-postgres.yaml, compose-mariadb.yaml, compose-mysql.yaml and compose-mssql.yaml (tests/settings)
    services:
      postgres:
        image: postgres:17
        ports: ["5433:5432"]
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mariadb:
        image: mariadb:11
        ports: ["3306:3306"]
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
          MARIADB_DATABASE: test
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4
        ports: ["3307:3306"]
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_DATABASE: test
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -utest -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports: ["1433:1433"]
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Test_Passw0rd"
          MSSQL_PID: Developer
        # The healthcheck also creates the "test" database (no env var for it)
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Test_Passw0rd -Q \"IF DB_ID('test') IS NULL CREATE DATABASE test\" -b"
          --health-interval 5s --health-timeout 10s --health-retries 30 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Tag matches pyproject version
        run: |
          VERSION="$(uv version --short)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $VERSION"
            exit 1
          fi

      # sqlite, postgres, mariadb, mysql and mssql; Oracle is too heavy for CI
      - name: Tests
        run: uv run --locked pytest -q -k "not config_oracle"

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/sqlalchemy-rest-api/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      # TestPyPI is only a rehearsal and never accepts a file name twice: if the version is already
      # there (an earlier run or a manual upload) it is skipped with a warning instead of failing
      - name: Publish to TestPyPI
        run: |
          VERSION="$(ls dist/*.tar.gz | sed -E 's/.*-([^-]+)\.tar\.gz$/\1/')"
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://test.pypi.org/pypi/sqlalchemy-rest-api/$VERSION/json")"
          if [ "$status" = 200 ]; then
            echo "::warning::Version $VERSION already on TestPyPI, not uploaded again"
            exit 0
          fi
          uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/

  pypi:
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sqlalchemy-rest-api/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      # --check-url: files already on PyPI with the same content are skipped (re-running the job is safe);
      # a different file with the same name still fails
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
