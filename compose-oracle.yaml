services:
  oracle:
    image: gvenzl/oracle-free:slim-faststart
    container_name: oracle-test
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: test
      APP_USER: test
      APP_USER_PASSWORD: test
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
