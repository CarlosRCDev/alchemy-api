[project]
name = "alchemy-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.1.6",
]

[project.optional-dependencies]
flask = [
    "flask>=3.1.3",
]
fastapi = [
    "fastapi>=0.162.0",
]
oracle = [
    "oracledb>=26.1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "flask>=3.1.3",
    "greenlet>=3.5.6",
    "httpx2>=2.16.0",
    "oracledb>=26.1.0",
    "pytest>=9.2.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
