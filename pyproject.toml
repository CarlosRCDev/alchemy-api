[project]
name = "sqlalchemy-rest-api"
version = "0.3.0"
description = "CRUD with python dicts and auto REST api (Flask/FastAPI) over existing databases with SQLAlchemy reflection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos RC" }]
requires-python = ">=3.12"
keywords = ["sqlalchemy", "rest", "api", "crud", "flask", "fastapi", "oracle", "mysql", "mariadb", "postgresql", "sqlserver", "reflection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "sqlalchemy>=2.1.6",
]

[project.optional-dependencies]
flask = [
    "flask>=3.1.3",
]
fastapi = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]
async = [
    "sqlalchemy[asyncio]>=2.1.6",
    "aiosqlite>=0.22.1",
]
oracle = [
    "oracledb>=26.1.0",
]
# Database drivers: each extra has the sync and the async driver ([async] adds greenlet)
mariadb = [
    "pymysql>=1.1.0",
    "aiomysql>=0.3.2",
]
mysql = [
    "pymysql>=1.1.0",
    "aiomysql>=0.3.2",
]
mssql = [
    # sync only: wheels include FreeTDS, no system ODBC driver needed
    "pymssql>=2.3.0",
]
postgres = [
    # binary: wheels with libpq included, no system library needed
    "psycopg[binary]>=3.1",
]
# Every extra above; keep in sync when adding a new one
all = [
    "sqlalchemy-rest-api[flask,fastapi,async,oracle,mariadb,mysql,mssql,postgres]",
]

[project.urls]
Homepage = "https://github.com/CarlosRCDev/alchemy-api"
Repository = "https://github.com/CarlosRCDev/alchemy-api"
Issues = "https://github.com/CarlosRCDev/alchemy-api/issues"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution "sqlalchemy-rest-api", import "alchemy_api" (flat layout, no src/)
module-name = "alchemy_api"
module-root = ""

[dependency-groups]
dev = [
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "flask>=3.1.3",
    "greenlet>=3.5.6",
    "httpx2>=2.16.0",
    "oracledb>=26.1.0",
    "psycopg[binary]>=3.3.6",
    "pymssql>=2.4.6",
    "pymysql>=1.2.3",
    "pytest>=9.2.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
